<!DOCTYPE html>
<html>
<head>
    <title>Caguas Screenings Preview</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0d0d0d; color: white; padding: 20px; }
        .screening-item { background: #1a1a1a; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .ticket-options { display: flex; gap: 15px; margin-top: 10px; }
        .ticket-option { background: #2a2a2a; padding: 12px; border-radius: 6px; flex: 1; text-decoration: none; color: #ff3b46; }
        .ticket-option:hover { background: #333; }
        .ticket-type { font-weight: bold; display: block; }
        .ticket-price { font-size: 0.9em; color: #a0a0a0; }
    </style>
</head>
<body>
    <h1>Filiberto - Caguas Screenings</h1>
    
    <div class="screening-item">
        <div class="screening-time">September 20 - 4:00PM @ C3Tec</div>
        <div class="ticket-options">
            <a href="#" class="ticket-option">
                <span class="ticket-type">Adult Ticket</span>
                <span class="ticket-price">$15.00</span>
            </a>
            <a href="#" class="ticket-option">
                <span class="ticket-type">Child Ticket</span>
                <span class="ticket-price">$10.00</span>
            </a>
        </div>
    </div>
    
    <div class="screening-item">
        <div class="screening-time">September 20 - 7:00PM @ C3Tec</div>
        <div class="ticket-options">
            <a href="#" class="ticket-option">
                <span class="ticket-type">Adult Ticket</span>
                <span class="ticket-price">$15.00</span>
            </a>
            <a href="#" class="ticket-option">
                <span class="ticket-type">Child Ticket</span>
                <span class="ticket-price">$10.00</span>
            </a>
        </div>
    </div>
</body>
</html>
